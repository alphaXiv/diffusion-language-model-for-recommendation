<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img">
  <title>Sampling steps versus NDCG</title>
  <desc>One sampling step has NDCG 0.01528, three steps 0.00846, and five steps 0.00850.</desc>
  <rect width="820" height="440" fill="#fbfaf7"/>
  <text x="55" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#17222d">Extra refinement erases most of the one-pass advantage</text>
  <text x="55" y="68" font-family="system-ui,sans-serif" font-size="14" fill="#52606d">Full-model NDCG@10 across diffusion forward passes; n=4 seeds</text>
  <line x1="110" y1="355" x2="750" y2="355" stroke="#9aa5b1"/>
  <line x1="110" y1="90" x2="110" y2="355" stroke="#9aa5b1"/>
  <polyline points="195,102 430,224 665,223" fill="none" stroke="#e87547" stroke-width="5"/>
  <circle cx="195" cy="102" r="10" fill="#e87547"/><circle cx="430" cy="224" r="10" fill="#3d7b8c"/><circle cx="665" cy="223" r="10" fill="#3d7b8c"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17222d">
    <text x="195" y="84" font-size="17" font-weight="700">0.01528</text>
    <text x="430" y="206" font-size="17" font-weight="700">0.00846</text>
    <text x="665" y="205" font-size="17" font-weight="700">0.00850</text>
    <text x="195" y="386" font-size="14">1 pass</text><text x="430" y="386" font-size="14">3 passes</text><text x="665" y="386" font-size="14">5 passes</text>
  </g>
  <line x1="110" y1="240" x2="750" y2="240" stroke="#e1e5e8"/>
  <text x="65" y="244" font-family="system-ui,sans-serif" font-size="12" fill="#687782">0.008</text>
  <text x="65" y="105" font-family="system-ui,sans-serif" font-size="12" fill="#687782">0.016</text>
  <text x="55" y="424" font-family="system-ui,sans-serif" font-size="12" fill="#687782">The paper reports three steps as best on MovieLens-1M; this reconstruction finds one step best.</text>
</svg>
