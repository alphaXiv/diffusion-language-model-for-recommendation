<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img">
  <title>Forced early decoding error robustness</title>
  <desc>Downstream NDCG retention after forcing a wrong first decoded item is near one for all methods and does not favor diffusion.</desc>
  <rect width="820" height="440" fill="#fbfaf7"/>
  <text x="55" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#17222d">The early-error stress test does not favor diffusion</text>
  <text x="55" y="68" font-family="system-ui,sans-serif" font-size="14" fill="#52606d">Downstream NDCG after forcing a wrong first decoded item ÷ clean downstream NDCG</text>
  <line x1="115" y1="365" x2="765" y2="365" stroke="#9aa5b1"/>
  <line x1="115" y1="95" x2="115" y2="365" stroke="#9aa5b1"/>
  <line x1="115" y1="230" x2="765" y2="230" stroke="#d25f3f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="720" y="220" font-family="system-ui,sans-serif" font-size="12" fill="#b34d32">100% retained</text>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#687782">
    <text x="72" y="369">96%</text><text x="72" y="302">98%</text><text x="66" y="234">100%</text><text x="66" y="166">102%</text><text x="66" y="99">104%</text>
  </g>
  <rect x="175" y="171" width="130" height="194" rx="4" fill="#778899"/>
  <rect x="365" y="247" width="130" height="118" rx="4" fill="#3d7b8c"/>
  <rect x="555" y="230" width="130" height="135" rx="4" fill="#e87547"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17222d">
    <text x="240" y="158" font-size="17" font-weight="700">101.7%</text>
    <text x="430" y="234" font-size="17" font-weight="700">99.5%</text>
    <text x="620" y="217" font-size="17" font-weight="700">100.0%</text>
    <text x="240" y="396" font-size="14">Autoregressive</text>
    <text x="430" y="396" font-size="14">3-step diffusion</text>
    <text x="620" y="396" font-size="14">1-step diffusion</text>
  </g>
  <text x="55" y="429" font-family="system-ui,sans-serif" font-size="12" fill="#687782">Values above 100% reflect ranking noise, not genuine improvement; n=4 seeds.</text>
</svg>
