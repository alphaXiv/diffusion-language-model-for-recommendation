<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img">
  <title>Stochastic top-10 consistency</title>
  <desc>Autoregression, full diffusion, no-voting diffusion, one-step diffusion, and plain diffusion have Jaccard consistency 0.574, 0.371, 0.374, 0.536, and 0.560.</desc>
  <rect width="820" height="450" fill="#fbfaf7"/>
  <text x="55" y="42" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#17222d">Stability voting does not stabilize the top ten</text>
  <text x="55" y="68" font-family="system-ui,sans-serif" font-size="14" fill="#52606d">Mean pairwise Jaccard overlap under small logit perturbations; higher is steadier</text>
  <line x1="105" y1="370" x2="780" y2="370" stroke="#9aa5b1"/>
  <g>
    <rect x="125" y="141" width="95" height="229" rx="3" fill="#778899"/>
    <rect x="260" y="222" width="95" height="148" rx="3" fill="#3d7b8c"/>
    <rect x="395" y="221" width="95" height="149" rx="3" fill="#9aa5b1"/>
    <rect x="530" y="156" width="95" height="214" rx="3" fill="#e87547"/>
    <rect x="665" y="146" width="95" height="224" rx="3" fill="#c3a267"/>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#17222d">
    <text x="172" y="129" font-size="15" font-weight="700">0.574</text><text x="172" y="397" font-size="13">AR</text>
    <text x="307" y="210" font-size="15" font-weight="700">0.371</text><text x="307" y="397" font-size="13">Full</text><text x="307" y="414" font-size="13">3-step</text>
    <text x="442" y="209" font-size="15" font-weight="700">0.374</text><text x="442" y="397" font-size="13">No</text><text x="442" y="414" font-size="13">voting</text>
    <text x="577" y="144" font-size="15" font-weight="700">0.536</text><text x="577" y="397" font-size="13">One</text><text x="577" y="414" font-size="13">step</text>
    <text x="712" y="134" font-size="15" font-weight="700">0.560</text><text x="712" y="397" font-size="13">Plain</text><text x="712" y="414" font-size="13">diffusion</text>
  </g>
</svg>
